<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReAfronders</title>
  <meta name="description" content="A living, generative atlas of Africa's natural wonders — country by country, starting with Zimbabwe.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%232ec4b6' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23f4d35e'/%3E%3C/svg%3E">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
</head>
<body>
  <canvas id="art" aria-hidden="true"></canvas>
  <canvas id="bloom" aria-hidden="true"></canvas>
  <svg id="map" role="img" aria-label="Map of Africa with natural wonders"></svg>
  <div id="tip" role="tooltip"></div>

  <header class="bar">
    <div class="brand"><span class="dot"></span>ReAfronders <em>a living atlas</em></div>
    <nav class="crumbs" id="crumbs"></nav>
    <div class="actions">
      <button id="btn-africa" title="Back to the whole continent">Africa</button>
      <button id="btn-tour" title="Auto-tour the wonders (T)">Tour</button>
      <button id="btn-exhibit" title="Fullscreen, no UI (E)">Exhibit</button>
      <button id="btn-studio" class="accent" title="Add, remove and restyle wonders (S)">Studio</button>
    </div>
  </header>

  <aside class="panel" id="panel" aria-live="polite"></aside>

  <aside class="studio" id="studio" aria-label="Studio editor" hidden>
    <div class="studio-head">
      <strong>Studio</strong>
      <span class="source" id="source"></span>
      <button class="ghost" id="studio-close" aria-label="Close studio">✕</button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="wonders" aria-selected="true">Wonders</button>
      <button role="tab" data-tab="look">Presentation</button>
      <button role="tab" data-tab="data">Data</button>
    </div>
    <section class="tab" data-tab="wonders"></section>
    <section class="tab" data-tab="look" hidden></section>
    <section class="tab" data-tab="data" hidden></section>
  </aside>

  <div id="toast" role="status"></div>
  <div id="pickhint" hidden>Click the map to place the wonder · <kbd>Esc</kbd> to cancel</div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
